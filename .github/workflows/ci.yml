name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
# Replace stale PR checks; keep push, release, and manual runs independent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - run: rudy-web-audit --version
  native-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: r4venrudy/rudy-evidence
          ref: 9a7dc387b9d265de1f98e3b356c8f0d58bb67caa
          path: .sdk
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: cmake -S .sdk -B .sdk/build -DRE_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build .sdk/build --parallel 2
      - name: Exercise native exports and existing scan gates
        run: |
          export PYTHONPATH="$PWD/.sdk/bindings/python"
          export RUDY_EVIDENCE_LIBRARY="$PWD/.sdk/build/librudy_evidence.so"
          python -m unittest discover -s tests -v
