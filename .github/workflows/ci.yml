name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - run: rudy-web-audit --version
  native-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: r4venrudy/rudy-evidence
          ref: 1ed87e37aed0bafc7595e06514367d4c89136137
          path: .sdk
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: cmake -S .sdk -B .sdk/build -DRE_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build .sdk/build --parallel 2
      - name: Exercise native exports and existing scan gates
        run: |
          export PYTHONPATH="$PWD/.sdk/bindings/python"
          export RUDY_EVIDENCE_LIBRARY="$PWD/.sdk/build/librudy_evidence.so"
          python -m unittest discover -s tests -v
